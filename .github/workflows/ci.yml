name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Server unit tests
        # Covers diagnostics (incl. undici cause-chain classification),
        # provider state machine and streaming. The daily-limit suite is
        # excluded: it requires a live server on :4005 which CI does not run.
        run: node --test test/diagnostics.test.js test/provider-state-machine.test.js test/streaming.test.js

      - name: Client tests
        run: npm test --prefix client

      - name: Build
        run: npm run build
